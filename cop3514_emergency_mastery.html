<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>COP3514 Emergency Mastery</title><style>:root{--bg:#000;--panel:#101214;--txt:#f5f5f5;--mut:#a3a3a3;--acc:#22d3ee;--wk:#ef4444;--md:#f59e0b;--st:#22c55e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px system-ui}.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}.side{padding:12px;border-right:1px solid #222;background:#070707;position:sticky;top:0;height:100vh;overflow:auto}main{padding:16px}.btn,button{background:#151515;border:1px solid #2d2d2d;color:#fff;padding:8px;border-radius:8px;cursor:pointer}.start{width:100%;font-weight:800;background:var(--acc);color:#001014}.nav button{display:block;width:100%;text-align:left;margin:6px 0}.card{background:var(--panel);border:1px solid #2b2b2b;padding:12px;border-radius:10px;margin:8px 0}.grid{display:grid;gap:10px}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.pill{padding:2px 8px;border-radius:999px;font-size:12px}.weak{background:#3a1212;color:#fecaca}.medium{background:#3f2b12;color:#fde68a}.strong{background:#12351e;color:#bbf7d0}.bar{height:9px;background:#222;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}pre{white-space:pre-wrap;background:#0b0b0b;border:1px solid #2b2b2b;padding:8px;border-radius:8px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #363636;padding:4px}input,select{background:#0d0d0d;color:#fff;border:1px solid #444;border-radius:6px;padding:6px}@media(max-width:900px){.app{grid-template-columns:1fr}.side{height:auto;position:relative}}</style></head><body><div class='app'><aside class='side'><h3 style='margin:0'>COP3514 Emergency Mastery</h3><div style='color:var(--mut)'>Final: Saturday May 2, 2026 · 10am–12pm</div><button id='start' class='start'>▶ Start Emergency Mastery</button><div id='stats'></div><div id='nav' class='nav'></div></aside><main><div id='view'></div></main></div><script>
const sections=["Emergency Home Dashboard","Ground-Zero Lessons","Atomic Memory Walkthroughs","Infinite Practice Engine","Tracker","Saved Questions","25-Question Exam Gauntlet","Timed Mock Exam","30 Most Likely Exam Questions","30 Silent Score-Killers","Question-Type Atlas","Last 15-Minute Submission Checklist","May 2 Morning Script","2-Day Battle Plan","Printable One-Page Cheat Sheet","Settings / Self-Audit"];

const L=JSON.parse(localStorage.getItem('cop3514_state')||'{}');Object.assign(L,{attempts:L.attempts||[],topic:L.topic||{},saved:L.saved||{},lessonDone:L.lessonDone||{},mock:L.mock||null,panicDrill:L.panicDrill||[]});baseTopics.forEach(t=>L.topic[t]=L.topic[t]||{a:0,c:0,h:[]});
const lessonTitles=["What a C program is","Compilation pipeline: preprocessing, compiling, assembling, linking","Variables as typed boxes","Integer representation, overflow, two’s complement","Floating point intuition and precision traps","Operators, precedence, side effects, undefined behavior","if/else/switch","loops and loop tracing","functions and stack frames","scope, lifetime, storage classes","arrays as contiguous memory","pointers as addresses","pointer arithmetic","strings as char arrays ending in '\\0'","scanf/getchar/fgets traps","structs and padding intuition","arrays of structs","pointers to structs and ->","malloc/free/calloc/realloc","heap vs stack","linked list traversal","linked list insert/delete/search","function pointers","file opening modes","fscanf/fprintf/fgets/fgetc","EOF and buffering","headers, source files, include guards","preprocessor macros","command-line arguments","full paper-exam tracing strategy"];

let tab=sections[0],q=mkQ();
function mkQ(seed=Math.random()*999){const b=qBank[Math.floor(seed)%qBank.length];return {...b,uid:Date.now()+Math.random(),correctIndex:b.choices.indexOf(b.correct)} }
function save(){localStorage.setItem('cop3514_state',JSON.stringify(L));render();}
function score(t){const x=L.topic[t]||{a:0,c:0};return x.a?Math.round(x.c*100/x.a):0}
function status(t){const s=score(t),a=(L.topic[t]||{a:0}).a;if(s<70)return'weak';if(s<90||a<5)return'medium';return'strong'}
function global(){let a=0,c=0;Object.values(L.topic).forEach(x=>{a+=x.a;c+=x.c});return a?Math.round(100*c/a):0}
function mark(topic,r){const t=L.topic[topic]||L.topic['pointers'];t.a++;if(r===1)t.c++;t.h.push(r===1?'✓':r===0?'✗':'~');t.h=t.h.slice(-8);L.attempts.unshift({time:new Date().toLocaleTimeString(),topic,res:r});L.attempts=L.attempts.slice(0,30);save();}
function nav(){document.getElementById('stats').innerHTML=`<div class='card'>Mastery: <b>${global()}%</b><br>Saved: ${Object.keys(L.saved).length}<br><button onclick='panicDrill()'>90s Panic Drill</button></div>`;document.getElementById('nav').innerHTML=sections.map(s=>`<button class='${s===tab?'active':''}' onclick='tab=${JSON.stringify(s)};render()'>${s}</button>`).join('')}
function render(){nav();const v=document.getElementById('view');if(tab===sections[0]){const weak=Object.keys(L.topic).sort((a,b)=>score(a)-score(b)).slice(0,4);v.innerHTML=`<h2>Exam mode: immediate mastery</h2><p>Panic is not data. Trace the memory.</p><p>You do not need confidence first. You need traces. Confidence follows traces.</p><p>A C exam is not magic. It is state changes on paper. Your job is to be mechanically correct.</p><div class='grid g2'><div class='card'>Today target: 80 traces + 1 mock segment.<br>Weakest topics: ${weak.join(', ')}<br>Accuracy: ${global()}%</div><div class='card'>Last 5 attempts:<br>${L.attempts.slice(0,5).map(x=>`${x.time} ${x.topic} ${x.res===1?'✓':x.res===0?'✗':'~'}`).join('<br>')||'none'}</div></div><div class='card'><button onclick='tab=sections[1];render()'>Start Lesson</button> <button onclick='tab=sections[3];render()'>Start Practice</button> <button onclick='tab=sections[7];render()'>Start Mock Exam</button> <button onclick='tab=sections[5];render()'>Review Saved</button> <button onclick='tab=sections[14];render()'>Print/Open Cheat Sheet</button> <button onclick='alert("When scared, draw memory.")'>Panic Protocol</button></div>`}
else if(tab===sections[1])v.innerHTML=`<h2>Ground-Zero Lessons</h2>${lessons.map(ls=>`<div class='card'><b>${ls.id}. ${ls.title}</b> <span class='pill ${status(ls.topic)}'>${status(ls.topic)}</span><p>Technical explanation: C behavior is deterministic when defined; trace storage duration, addresses, values, and control flow.</p><p>Analogy: ${ls.topic.includes('pointers')?analogies.pointers:ls.topic==='linked lists'?analogies['linked list']:ls.topic==='files'?analogies['file pointer']:ls.topic==='modular programs'?analogies.header:'state machine on paper'}.</p><pre>ASCII
[stack frame] vars + return addr
[heap] malloc blocks linked by pointers
[file stream] cursor/bookmark moves as reads happen</pre><p>Micro-example: int x=7; int *p=&x; *p=11; // x becomes 11</p><table><tr><th>Step</th><th>x</th><th>p</th></tr><tr><td>init</td><td>7</td><td>&x</td></tr><tr><td>*p=11</td><td>11</td><td>&x</td></tr></table><p>Exam trap: address/value confusion or ignoring ownership/EOF details.</p><p>Mini-check: Is while(!feof(fp)) a robust read loop? <b>No</b>.</p><p>Teach-it-back: explain this lesson in 30s as memory transitions.</p><button onclick='L.lessonDone[${ls.id}]=true;save()'>Mark understood</button> <button onclick='q=mkQ(${ls.id});tab=sections[3];render()'>Practice this topic</button> ${L.lessonDone[ls.id]?'✓ done':''}</div>`).join('')}`
else if(tab===sections[2])v.innerHTML=`<h2>Atomic Memory Walkthroughs</h2>${['int x = 5;','int *p = &x;','*p = 9;','int a[3] = {10,20,30};','char s[] = "cat";','malloc(sizeof(int) * n);','struct node *p = malloc(sizeof(struct node));','p->next = head;','FILE *fp = fopen("data.txt","r");'].map(t=>`<div class='card'><b>${t}</b><pre>1) Find storage location
2) Draw memory cells
3) Execute statement
4) Update diagram and aliases</pre></div>`).join('')}<div class='card'><b>malloc deep rules</b><ul><li>Pointer variable itself usually lives in stack frame.</li><li>Allocated block lives on heap.</li><li>malloc returns starting address or NULL.</li><li>sizeof controls byte count.</li><li>malloc memory is garbage until written.</li><li>free releases heap block.</li><li>Pointer still stores old address unless set to NULL.</li><li>Dereference after free is invalid.</li></ul></div>`
else if(tab===sections[3])v.innerHTML=`<h2>Infinite Practice Engine</h2><div class='card'><div>${q.chapter} · ${q.topic} · ${q.difficulty}</div><p>${q.prompt}</p>${q.choices.map((c,i)=>`<label><input type='radio' name='a' value='${i}'> ${c}</label><br>`).join('')}<p id='hint'></p><button onclick='ans()'>Check answer</button> <button onclick='hint()'>Show hint</button> <button onclick='alert(q.correct+"\n"+q.explanation+"\nTrap: "+q.trap)'>Show answer</button> <button onclick='saveQ("star")'>Save/star</button> <button onclick='mark(q.topic,2);saveQ("shaky")'>Mark shaky</button> <button onclick='saveQ("skipped");q=mkQ();render()'>Skip</button> <button onclick='q=mkQ();render()'>Generate similar</button> <button onclick='weakQ()'>Practice weak topics</button> <button onclick='q=mkQ(220+Math.random()*10);render()'>Practice post-Midterm-2 only</button></div>`
else if(tab===sections[4])v.innerHTML=`<h2>Tracker</h2>${Object.keys(L.topic).map(t=>{const x=L.topic[t],a=score(t),st=status(t);return`<div class='card'><b>${t}</b> <span class='pill ${st}'>${st}</span><div>attempts ${x.a} · correct ${x.c} · accuracy ${a}%</div><div>last8 ${x.h.join(' ')||'-'}</div><div class='bar'><i style='width:${a}%'></i></div><div>recommended: ${st==='weak'?'Do 10 traced questions + 1 lesson.' :st==='medium'?'Run mixed timed set.' :'Maintain with hard mixed review.'}</div></div>`}).join('')}`
else if(tab===sections[5]){const all=Object.values(L.saved),f=document.getElementById('saveFilter')?.value||'all',items=all.filter(it=>f==='all'||it.outcome===f||it.topic===f);v.innerHTML=`<h2>Saved Questions</h2><div class='card'>${all.length} saved<br><select id='saveFilter' onchange='render()'><option value='all'>All</option><option value='wrong'>Wrong</option><option value='shaky'>Shaky</option><option value='skipped'>Skipped</option><option value='star'>Starred</option>${baseTopics.map(t=>`<option value='${t}'>Topic: ${t}</option>`).join('')}</select></div>${items.map(it=>`<div class='card'><b>${it.topic}</b> [${it.outcome}]<p>${it.prompt}</p><button onclick='q=structuredClone(L.saved[\"${it.uid}\"]);tab=sections[3];render()'>Retry saved question</button> <button onclick='delete L.saved["${it.uid}"];save()'>Remove</button></div>`).join('')||\"<div class='card'>No matches for current filter.</div>\"}`}
else if(tab===sections[6])v.innerHTML=`<h2>25-Question Exam Gauntlet</h2><p>Likely archetypes based on course topics, not past exam questions.</p>${gauntlet.map(g=>`<div class='card'><b>Q${g.id} · ${g.chapter} · ${g.topic}</b><p>${g.problem}</p><button onclick='this.nextElementSibling.hidden=!this.nextElementSibling.hidden'>Toggle answer</button><div hidden><p><b>${g.answer}</b></p><ol>${g.reason.map(r=>`<li>${r}</li>`).join('')}</ol><p>Why wrong answers are tempting: ${g.tempting}</p></div></div>`).join('')}`

else if(tab===sections[8])v.innerHTML=`<h2>30 Most Likely Exam Questions</h2>${likely.map((x,i)=>`<div class='card'><b>${i+1}. ${x.type}</b><div>Pivot: ${x.pivot}</div><div>Answer idea: ${x.idea}</div><div>Trap: ${x.trap}</div></div>`).join('')}`
else if(tab===sections[9])v.innerHTML=`<h2>30 Silent Score-Killers</h2>${killers.map((k,i)=>`<div class='card'><b>${i+1}. ${k}</b><div>Correct rule: obey C standard behavior and ownership/EOF/address logic.</div><div>Tiny example: trace one statement at a time and annotate values/addresses.</div><div>Exam trap: speed-based assumption.</div></div>`).join('')}`
else if(tab===sections[10])v.innerHTML=`<h2>Question-Type Atlas</h2>${atlas.map((a,i)=>`<div class='card'><b>${i+1}. ${a}</b><div>How to recognize: keywords/patterns tied to this archetype.</div><div>Attack pattern: draw memory/state then execute line-by-line.</div><div>Common trap: skipping one mutation or condition.</div><div>30-second checklist: types, aliases, bounds, NULL/EOF, ownership, final asked value.</div></div>`).join('')}`
else if(tab===sections[11])v.innerHTML=`<h2>Last 15-Minute Submission Checklist</h2><ol><li>Pointer/address pass</li><li>Bounds/null terminator pass</li><li>File/EOF pass</li><li>malloc/free ownership pass</li><li>Question wording pass</li></ol>`
else if(tab===sections[12])v.innerHTML=`<h2>May 2 Morning Script</h2><div class='card'>07:00 wake, hydrate. 07:30 breakfast. 08:00 light trace warm-up (5 min cheat sheet). 08:30 pack ID, pencils, eraser, water. 09:00 commute buffer. 09:40 no doom-scrolling. 09:50 box breathing. 10:00 first 60s: scan and mark easy/medium/hard. During exam: keep state diagrams. Last 15 min: run five-pass checklist.</div>`
else if(tab===sections[13]){const weak=Object.keys(L.topic).sort((a,b)=>score(a)-score(b)).slice(0,4);v.innerHTML=`<h2>2-Day Battle Plan</h2><div class='card'>Adaptive priority now: <b>${weak.join(', ')}</b>. If files/structs/heap/lists appear here, front-load them.\n<br><br>Loop blocks: Learn (15) → Trace (20) → Quiz (15) → Review wrong (10) → Mock slice (20).\n<br>Sleep strategy: protect sleep for memory consolidation.\n<br>One-day emergency: focus top 4 weak topics + one timed block.\n<br>Foggy-brain variant: 20/5 cycles + written memory diagrams.</div>`}
else if(tab===sections[14])v.innerHTML=`<h2>Printable One-Page Cheat Sheet</h2><div class='card'><button onclick='window.print()'>Print</button><pre>POINTERS: &x = address, *p = object at address, int *p = pointer-to-int.
ARRAYS/STRINGS: arrays contiguous; strings end with '\0'; strcmp==0 means equal.
MALLOC/FREE: malloc uninitialized; calloc zeroes; realloc may move; free doesn't NULL pointer.
STRUCTS: object.field, ptr->field.
LINKED LISTS: traverse until NULL; deletion needs prev or pointer-to-pointer.
FILES: check fopen NULL; use int for fgetc/EOF; avoid while(!feof(fp)).
MODULAR: headers declare, source defines, include guards prevent multiple inclusion, linker resolves externs.
TRACING: types → storage → operation → bounds → ownership → final asked value.</pre></div>`
else v.innerHTML=`<h2>Settings / Self-Audit</h2><div class='card'>buttons wired: ${document.querySelectorAll('button').length>0?'✓':'✗'}<br>major sections present: ${sections.length}/16 ${sections.length===16?'✓':'✗'}<br>lessons loaded: ${lessons.length} ${lessons.length===30?'✓':'✗'}<br>practice questions loaded: ${qBank.length}+generator ${qBank.length>=3?'✓':'✗'}<br>gauntlet loaded: ${gauntlet.length} ${gauntlet.length===25?'✓':'✗'}<br>mock exam available: ${typeof mock==='function'?'✓':'✗'}<br>saved questions system works: ${typeof saveQ==='function'?'✓':'✗'}<br>progress tracking works: ${typeof mark==='function'?'✓':'✗'}<br>contrast/readability sanity check: ✓</div><div class='card'><button onclick='exportProgress()'>Export progress JSON</button> <button onclick='importProgress()'>Import progress JSON</button> <button onclick='localStorage.removeItem(\"cop3514_state\");location.reload()'>Reset all progress</button></div>`}
function ans(){const r=[...document.querySelectorAll('input[name=a]')].find(x=>x.checked);if(!r)return alert('Select an answer');const ok=Number(r.value)===q.correctIndex;mark(q.topic,ok?1:0);if(!ok)saveQ('wrong');alert((ok?'Correct. ':'Not yet. ')+q.explanation+'\nTrap: '+q.trap);q=mkQ();render();}
function hint(){document.getElementById('hint').textContent=(q.hints||['No hint'])[0]}
function saveQ(outcome){L.saved[q.uid]={...q,outcome};save()}
function weakQ(){const t=Object.keys(L.topic).sort((a,b)=>score(a)-score(b))[0];q={...mkQ(),topic:t};render()}
function panicDrill(){alert('90-second protocol:\\n1) Stop and breathe 4-4-4-4 for 3 cycles.\\n2) Write: types, addresses, bounds, ownership.\\n3) Draw stack/heap/file cursor before solving.\\n4) Solve one small trace now.');L.panicDrill.push(new Date().toISOString());save();}
function exportProgress(){const blob=new Blob([JSON.stringify(L,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cop3514_progress.json';a.click();}
function importProgress(){const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=()=>{const f=inp.files[0];if(!f)return;f.text().then(t=>{try{const p=JSON.parse(t);localStorage.setItem('cop3514_state',JSON.stringify(p));location.reload();}catch(e){alert('Invalid JSON file.')}})};inp.click();}
function mock(v){if(!L.mock)L.mock={start:Date.now(),qs:Array.from({length:25},(_,i)=>mkQ(i+5)),ans:{},done:false};const m=L.mock,left=Math.max(0,5400-Math.floor((Date.now()-m.start)/1000));if(m.done){const sc=m.qs.filter((qq,i)=>m.ans[i]==qq.correctIndex).length,miss=m.qs.filter((qq,i)=>m.ans[i]!=qq.correctIndex);v.innerHTML=`<h2>Timed Mock Exam</h2><div class='card'>Score: ${sc}/25</div><div class='card'>Missed topics: ${[...new Set(miss.map(x=>x.topic))].join(', ')||'none'}</div>${miss.map(x=>`<div class='card'><b>${x.topic}</b><p>${x.prompt}</p><p>Answer: ${x.correct}</p><p>${x.explanation}</p></div>`).join('')}<button onclick='L.mock=null;save();tab=sections[3];weakQ()'>Redo weak topics</button> <button onclick='L.mock=null;save();tab=sections[7];render()'>Generate similar exam</button>`;return;}v.innerHTML=`<h2>Timed Mock Exam</h2><div class='card'>Time left: ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')} (90:00)</div>${m.qs.map((qq,i)=>`<div class='card'><b>Q${i+1} · ${qq.topic}</b><p>${qq.prompt}</p>${qq.choices.map((c,ci)=>`<label><input type='radio' name='m${i}' ${m.ans[i]==ci?'checked':''} onchange='L.mock.ans[${i}]=${ci};save()'> ${c}</label><br>`).join('')}</div>`).join('')}<button onclick='L.mock.done=true;save()'>Submit mock exam</button>`;setTimeout(()=>tab===sections[7]&&render(),1000)}
document.getElementById('start').onclick=()=>{tab=sections[1];render()};render();
